<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Unified workflow screen designs</title>
<style>
*{box-sizing:border-box}body{margin:0;width:1600px;height:900px;overflow:hidden;background:#fff;color:#202020;font:13px Inter,ui-sans-serif,system-ui,sans-serif}.shell{display:flex;height:900px}.sidebar{width:220px;flex:none;background:#fafafa;border-right:1px solid #e8e8e8;padding:23px 14px;display:flex;flex-direction:column}.brand{font-size:20px;font-weight:820;letter-spacing:-.8px;margin:0 9px 27px}.brand i{display:inline-grid;place-items:center;width:29px;height:29px;background:#c4f542;border-radius:8px;font-style:normal;margin-right:9px}.label{font-size:10px;color:#999;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin:15px 11px 7px}.nav{font-size:13px;color:#646464;padding:10px 13px;border-radius:8px;margin-bottom:3px}.nav.on{background:#edf9c7;color:#253409;font-weight:750}.spacer{flex:1}.sidefoot{border-top:1px solid #e9e9e9;padding:15px 11px;color:#888;font-size:11px;line-height:1.5}.main{width:1380px;display:flex;flex-direction:column;min-width:0}.top{height:67px;flex:none;border-bottom:1px solid #ebebeb;padding:0 26px;display:flex;align-items:center;gap:13px}.crumb{font-size:14px;color:#777}.crumb strong{color:#202020}.badge{font-size:10px;font-weight:750;padding:5px 7px;border-radius:5px;background:#f0f0f0;color:#666}.badge.green{background:#edf7d9;color:#496a1a}.badge.orange{background:#fff2df;color:#9b641f}.badge.red{background:#ffefed;color:#b64435}.topright{margin-left:auto;display:flex;gap:9px}.btn{border:1px solid #ddd;border-radius:7px;background:#fff;color:#292929;font-size:11px;font-weight:750;padding:9px 13px;white-space:nowrap}.btn.dark{background:#242424;color:#fff;border-color:#242424}.btn.lime{background:#c4f542;border-color:#c4f542;color:#203000}.btn.disabled{opacity:.48}.view{flex:1;position:relative;background:#fcfcfc;overflow:hidden}.page{padding:31px 37px}.heading{display:flex;align-items:flex-start}.heading h1{font-size:29px;letter-spacing:-1px;margin:0 0 6px}.heading p{font-size:12px;color:#777;margin:0}.heading .right{margin-left:auto;display:flex;gap:8px}.card{background:#fff;border:1px solid #e2e2e2;border-radius:10px}.muted{color:#797979}.mini{font-size:10px;color:#888}.section{font-size:10px;font-weight:800;color:#929292;text-transform:uppercase;letter-spacing:1px}.hline{height:1px;background:#ececec;margin:18px 0}.field{margin-bottom:18px}.field label{display:block;font-size:11px;font-weight:750;margin-bottom:7px}.input{min-height:37px;border:1px solid #dedede;border-radius:7px;background:#fff;padding:9px 11px;font-size:12px}.input.select:after{content:'⌄';float:right;color:#888}.hint{font-size:10px;color:#888;margin-top:6px;line-height:1.5}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{border:1px solid #dedede;background:#fff;border-radius:17px;padding:6px 10px;font-size:11px;color:#666}.pill.on{background:#242424;border-color:#242424;color:#fff}.notice{padding:13px 15px;border:1px solid #dce5eb;background:#f7fbfe;border-radius:8px;color:#415d73;font-size:11px;line-height:1.5}.notice.green{border-color:#d5e5b8;background:#f8fcef;color:#4b621e}.notice.red{border-color:#eac7c2;background:#fff7f5;color:#a44739}.table{border:1px solid #e5e5e5;border-radius:9px;overflow:hidden;background:#fff}.table .tr{display:grid;align-items:center;border-bottom:1px solid #eee;padding:12px 16px;gap:14px;font-size:12px}.table .tr:last-child{border-bottom:0}.table .head{background:#fafafa;color:#888;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.7px}.listicon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:#ecf7d9;font-weight:800;color:#537522}.success{color:#527b1c}.danger{color:#b84738}.block{border:1px solid #e4e4e4;border-radius:9px;background:#fff;padding:14px 16px}.block h3{margin:0 0 6px;font-size:13px}.block p{font-size:11px;color:#777;line-height:1.5;margin:0}.library .filters{display:flex;gap:7px;margin:27px 0 18px}.library .table .tr{grid-template-columns:42px 1.7fr 1fr 95px}.library .table .tr:not(.head){height:78px}.library .table strong{font-size:13px}.library .table small{display:block;color:#777;font-size:10px;margin-top:6px}.choice{position:absolute;right:25px;top:173px;width:370px;background:#fff;border:1px solid #ddd;border-radius:12px;box-shadow:0 16px 45px #0002;padding:20px;z-index:3}.choice h2{font-size:18px;margin:0 0 5px}.choice p{font-size:11px;color:#777;margin:0 0 16px}.option{border:1px solid #ddd;border-radius:9px;padding:15px;margin-top:10px;background:#fff}.option.selected{border:2px solid #a8d04e;background:#fbfef5;padding:14px}.option strong{display:block;font-size:13px}.option span{display:block;font-size:11px;color:#777;margin-top:5px;line-height:1.4}.choice .buttons{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.library .shade{position:absolute;inset:0;background:#ffffff70;z-index:2}.config .grid{display:grid;grid-template-columns:190px 1fr 365px;gap:23px;margin-top:25px}.steps{padding:14px}.stepitem{padding:11px 9px;border-radius:7px;font-size:11px;margin-top:6px;color:#666}.stepitem.selected{background:#eef8d9;color:#30490d;font-weight:760}.form{padding:22px 25px}.form h2{margin:0 0 5px;font-size:19px}.form .subtitle{color:#777;font-size:11px;margin-bottom:22px}.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}.code{font-family:ui-monospace,SFMono-Regular,monospace;font-size:11px}.table.report .tr{grid-template-columns:1.4fr 95px 65px}.aside{padding:20px}.aside h2{font-size:16px;margin:0 0 6px}.aside p{font-size:11px;color:#777;line-height:1.5}.config .line{font-size:11px;padding:10px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between}.condition .grid{display:grid;grid-template-columns:390px 1fr;gap:22px;margin-top:25px}.rules{padding:19px}.rule{border:1px solid #e3e3e3;border-radius:8px;padding:13px 15px;margin:11px 0}.rule.active{border:2px solid #a7c967;background:#f9fdf2;padding:12px 14px}.rule strong{display:block;font-size:12px}.rule small{display:block;font-size:10px;color:#777;margin-top:5px}.editor{padding:22px 26px}.editor h2{font-size:20px;margin:0 0 5px}.group{border-left:3px solid #badc83;margin:12px 0;padding-left:12px}.group.any{border-color:#beb1e5;margin:12px 0 12px 22px}.group .caption{font-size:10px;font-weight:800;color:#668b2e;text-transform:uppercase;letter-spacing:.7px;padding:4px 0}.group.any .caption{color:#7a62b7}.predicate{display:grid;grid-template-columns:1.3fr 115px 150px;gap:10px;margin:8px 0}.predicate .input{font-size:11px}.condition .preview{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:15px}.condition .preview .block{min-height:105px}.validation .grid{display:grid;grid-template-columns:300px 1fr 370px;gap:20px;margin-top:24px}.validation .overview,.validation .problemrail{padding:19px}.validation .issue{border:1px solid #eac3bd;border-radius:9px;background:#fff8f6;padding:12px;margin:10px 0;font-size:11px;line-height:1.5}.validation .issue strong{display:block;color:#a54236;font-size:12px;margin-bottom:4px}.validation .issue small{display:block;color:#777;margin-top:6px}.validation .sample{padding:24px}.validation .sample h2{font-size:19px;margin:0 0 5px}.validation .sample .input.bad{border-color:#cf6e60;background:#fffafa}.validation .map{margin-top:18px;border:1px solid #e4e4e4;border-radius:8px;padding:15px}.validation .map .item{padding:9px 10px;border-left:2px solid #cfe6a3;margin:7px 0;background:#fafafa;font-size:11px}.validation .map .item.bad{border-left-color:#d06b60;background:#fff8f6}.validation .bottom{margin-top:20px;padding:17px;border:1px solid #ead2ad;background:#fffaf1;border-radius:8px;font-size:11px;line-height:1.55}
</style>
<div class="shell"><aside class="sidebar"><div class="brand"><i>⌘</i>cezar</div><div class="label">Workspace</div><div class="nav">▤ &nbsp; Tasks</div><div class="nav">▣ &nbsp; Inbox</div><div class="label">Build</div><div class="nav">✳ &nbsp; Skills</div><div class="nav on">◇ &nbsp; Workflows</div><div class="nav">⚙ &nbsp; Settings</div><div class="spacer"></div><div class="sidefoot">Selected project<br>Local workspace</div></aside><main class="main"><div class="top"><div class="crumb" id="crumb">Workflows</div><span class="badge orange">Proposed design</span><div class="topright" id="actions"></div></div><div class="view" id="view"></div></main></div>
<script>
const screen=new URLSearchParams(location.search).get('screen')||'library';const view=document.getElementById('view');const actions=document.getElementById('actions');const crumb=document.getElementById('crumb');
const b=(name,extra='')=>`<button class="btn ${extra}">${name}</button>`;
if(screen==='library'){crumb.innerHTML='Workflows';actions.innerHTML=b('Import YAML')+b('New workflow','dark');view.className+=' library';view.innerHTML=`<div class="page"><div class="heading"><div><h1>Workflows</h1><p>One editor for a sequence, a decision, a loop, or a parallel group.</p></div></div><div class="filters"><span class="pill on">All</span><span class="pill">Built in</span><span class="pill">Recent</span></div><div class="table"><div class="tr head"><span></span><span>Workflow</span><span>Steps</span><span></span></div><div class="tr"><div class="listicon">◇</div><div><strong>open-mercato-feature-flow</strong><small>Shape → Spec → Implement → Parallel reviews → Decision + rework</small></div><span class="muted">11 steps · 3 reviewers · 1 loop</span><strong>Edit →</strong></div><div class="tr"><div class="listicon">≡</div><div><strong>quick-task</strong><small>Built in · single agent step</small></div><span class="muted">1 step</span><strong>View →</strong></div><div class="tr"><div class="listicon">≡</div><div><strong>code-checks</strong><small>Agent → typecheck → tests → review</small></div><span class="muted">4 steps</span><strong>Edit →</strong></div></div><div class="notice" style="margin-top:21px;width:840px">A simple sequence is a workflow with one route out of each step. Add a decision or loop in the same editor whenever the job needs one.</div></div><div class="shade"></div><div class="choice"><h2>New workflow</h2><p>Name the workflow, then add steps in the editor.</p><div class="field"><label>Workflow name</label><div class="input">my-feature-workflow</div><div class="hint">Saved in this project's workflow library.</div></div><div class="notice green">Start with one agent step. Add checks, decisions, loops, or parallel reviewers as needed.</div><div class="buttons">${b('Cancel')}${b('Create workflow','dark')}</div></div>`}
if(screen==='agent'){crumb.innerHTML='Workflows / <strong>open-mercato-feature-flow</strong> / Agent step';actions.innerHTML=b('Export YAML')+b('Save workflow','dark');view.className+=' config';view.innerHTML=`<div class="page"><div class="heading"><div><h1>Configure an agent step</h1><p>Bind the selected skill to inputs and declare the structured report required before routing.</p></div><span class="badge green">Step 3 of 11</span></div><div class="grid"><div class="card steps"><div class="section">Workflow steps</div><div class="stepitem">1 &nbsp; om-ux-shape</div><div class="stepitem">2 &nbsp; om-auto-write-spec</div><div class="stepitem selected">3 &nbsp; om-auto-implement-spec</div><div class="stepitem">4 &nbsp; Parallel reviews</div><div class="stepitem">5 &nbsp; Review gate</div></div><div class="card form"><h2>om-auto-implement-spec</h2><div class="subtitle">Implementation agent · creates or resumes an implementation PR</div><div class="two"><div class="field"><label>Skill</label><div class="input select">om-auto-implement-spec</div></div><div class="field"><label>Runner</label><div class="input select">Codex</div></div></div><div class="field"><label>Instructions</label><div class="input" style="height:71px">Implement the accepted spec in the selected project. Report the PR number, exact head, and change flags.</div><div class="hint">The skill's final prose does not choose a route; the accepted Cezar report does.</div></div><div class="section">Input bindings</div><div class="two" style="margin-top:11px"><div class="field"><label>Spec path</label><div class="input code">writeSpec.data.specPath</div></div><div class="field"><label>Spec PR</label><div class="input code">writeSpec.data.specPr</div></div></div><div class="section">Required report fields</div><div class="table report" style="margin-top:11px"><div class="tr head"><span>Field</span><span>Type</span><span>Required</span></div><div class="tr"><span class="code">prNumber</span><span>integer</span><strong>Yes</strong></div><div class="tr"><span class="code">headSha</span><span>git_sha</span><strong>Yes</strong></div><div class="tr"><span class="code">touchesAuth</span><span>boolean</span><strong>Yes</strong></div><div class="tr"><span class="code">touchesMoney</span><span>boolean</span><strong>Yes</strong></div></div><div class="row" style="margin-top:16px"><span class="mini">Report required before Cezar chooses a route.</span>${b('＋ Add field')}</div></div><div class="card aside"><h2>After this step</h2><p>Cezar validates the report and checks that the PR still points to <span class="code">headSha</span>.</p><div class="hline"></div><div class="line"><span>Next step</span><strong>Parallel reviews</strong></div><div class="line"><span>Rework route</span><strong>Repeat once</strong></div><div class="line"><span>Missing report</span><strong>Needs human review</strong></div><div class="line"><span>Stale PR head</span><strong>Needs human review</strong></div><div class="notice green" style="margin-top:19px">On rework, resume the existing implementation PR. The next reviewer group freezes its new head.</div><div class="hline"></div><div class="section">Validation</div><p class="success" style="margin-top:10px">✓ All required fields have declared types<br>✓ A bounded route leaves this step</p></div></div></div>`}
</script>
</html>
